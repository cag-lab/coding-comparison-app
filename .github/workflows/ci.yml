name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Built file matches template
        run: python3 scripts/build.py --check
      - name: Unit tests
        run: node --test tests/core.test.mjs
      - name: Reference cross-check
        run: |
          pip install numpy scikit-learn
          python3 tests/reference_check.py
